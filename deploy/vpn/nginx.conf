limit_req_zone $binary_remote_addr zone=ceavpn_sub:10m rate=3r/s;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name __SUB_DOMAIN__ __COVER_DOMAIN__;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name __SUB_DOMAIN__;

    ssl_certificate /etc/letsencrypt/live/__SUB_DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__SUB_DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ceavpn_tls:10m;
    ssl_session_timeout 1d;
    server_tokens off;

    # TLS fallback for networks where REALITY on 443 is unavailable. The
    # renderer replaces this exact, root-only path together with Xray's
    # loopback WebSocket path. Never enable a broad /ws location.
    location = __FALLBACK_WS_PATH__ {
        access_log off;
        error_log /dev/null;
        proxy_pass http://127.0.0.1:10001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }

    # Optional exact-path relays let a reachable canonical node carry the
    # WebSocket handshake to another region when a mobile network blocks that
    # region's public IP. The relay file is empty on ordinary nodes.
    include /etc/nginx/snippets/ceavpn-relays.conf;

    location ~ "^/connect/([A-Za-z0-9._~-]{1,160})/?$" {
        access_log off;
        default_type text/html;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
        return 200 '<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark"><title>Подключение CEA VPN</title><style>*{box-sizing:border-box}html{background:#080b13}body{margin:0;min-height:100vh;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f7f8fc;background:radial-gradient(circle at 50% -10%,#292456 0,#111525 38%,#080b13 76%);padding:24px 16px 52px}.shell{width:min(720px,100%);margin:auto}.brand{display:flex;align-items:center;gap:12px;margin:4px 2px 28px}.mark{display:grid;place-items:center;width:42px;height:42px;border-radius:14px;background:linear-gradient(145deg,#8b5cf6,#4f46e5);box-shadow:0 12px 35px #563fc766;font-size:22px}.brand b{font-size:20px;letter-spacing:.02em}.brand span{display:block;color:#8d95aa;font-size:12px;margin-top:2px}.hero{text-align:center;margin:0 auto 26px}.hero h1{font-size:clamp(30px,8vw,48px);line-height:1.05;margin:0 0 12px}.hero p{color:#aeb5c8;font-size:16px;line-height:1.5;margin:0 auto;max-width:540px}.platforms{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:24px 0}.platform{border:1px solid #282e42;background:#151a29;color:#aeb5c8;padding:11px 7px;border-radius:12px;font-weight:700;cursor:pointer}.platform.active{color:#fff;border-color:#7c63ff;background:#292348;box-shadow:inset 0 0 0 1px #7c63ff55}.steps{position:relative;display:grid;gap:12px}.card{position:relative;display:grid;grid-template-columns:46px 1fr;gap:14px;padding:20px;border:1px solid #252a3c;border-radius:20px;background:#121724cc;box-shadow:0 16px 50px #00000024}.number{display:grid;place-items:center;width:42px;height:42px;border-radius:14px;background:#24203f;color:#a995ff;font-weight:900}.content h2{font-size:18px;margin:1px 0 7px}.content p{color:#9ca4b8;line-height:1.5;margin:0}.action{display:flex;align-items:center;justify-content:center;width:100%;min-height:50px;margin-top:16px;border:0;border-radius:14px;background:linear-gradient(135deg,#7555f8,#5269f5);color:white;text-decoration:none;font-size:16px;font-weight:800;cursor:pointer;box-shadow:0 10px 28px #5f56ee42}.action.secondary{background:#232a3d;box-shadow:none}.action.done{background:#1f9d69}.manual{display:flex;gap:8px;align-items:center;margin-top:14px;padding:10px 10px 10px 13px;border:1px solid #2c3348;border-radius:12px;background:#0c101b}.manual code{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#b8c0d6}.copy{border:0;border-radius:9px;background:#2b3248;color:#fff;padding:9px 12px;font-weight:700;cursor:pointer}.hint{text-align:center;color:#737c94;font-size:13px;line-height:1.45;margin:22px 10px 0}@media(max-width:520px){body{padding:18px 12px 38px}.brand{margin-bottom:24px}.platforms{grid-template-columns:repeat(2,1fr)}.card{grid-template-columns:38px 1fr;padding:17px 15px;gap:11px}.number{width:36px;height:36px;border-radius:11px}}</style></head><body><main class="shell"><header class="brand"><div class="mark">🛡</div><div><b>CEA VPN</b><span>Безопасное подключение</span></div></header><section class="hero"><h1>Подключите VPN<br>за пару минут</h1><p>Выберите ваше устройство и выполните три простых шага. Персональная подписка уже готова.</p></section><nav class="platforms" aria-label="Выбор устройства"><button class="platform" data-os="ios">iPhone</button><button class="platform" data-os="android">Android</button><button class="platform" data-os="windows">Windows</button><button class="platform" data-os="macos">macOS</button></nav><section class="steps"><article class="card"><div class="number">1</div><div class="content"><h2>Установите Happ</h2><p>Скачайте бесплатное приложение для вашего устройства с официальной страницы.</p><a class="action secondary" href="https://www.happ.su/main" target="_blank" rel="noopener noreferrer">Скачать Happ</a></div></article><article class="card"><div class="number">2</div><div class="content"><h2>Добавьте подписку</h2><p>Нажмите кнопку и разрешите открыть Happ. Все доступные страны появятся автоматически.</p><a class="action" href="happ://add/https://__SUB_DOMAIN__:8443/sub/$1">Добавить подписку</a></div></article><article class="card"><div class="number">3</div><div class="content"><h2>Включите VPN</h2><p>В Happ выберите нужную страну, нажмите большую кнопку подключения и подтвердите создание VPN.</p><div class="action done">Готово — можно подключаться</div></div></article><article class="card"><div class="number">?</div><div class="content"><h2>Если кнопка не открылась</h2><p>Скопируйте ссылку, затем в Happ нажмите <b>+</b> и выберите добавление подписки из буфера.</p><div class="manual"><code id="subscription">https://__SUB_DOMAIN__:8443/sub/$1</code><button class="copy" id="copy" type="button">Копировать</button></div></div></article></section><p class="hint">Не передавайте эту страницу другим людям — ссылка является вашим личным ключом.</p></main><script>const buttons=[...document.querySelectorAll(".platform")];const agent=navigator.userAgent.toLowerCase();let os=agent.includes("android")?"android":agent.includes("iphone")||agent.includes("ipad")?"ios":agent.includes("win")?"windows":"macos";for(const button of buttons){button.classList.toggle("active",button.dataset.os===os);button.addEventListener("click",()=>{for(const item of buttons)item.classList.remove("active");button.classList.add("active")})}const copy=document.getElementById("copy");copy.addEventListener("click",async()=>{await navigator.clipboard.writeText(document.getElementById("subscription").textContent);copy.textContent="Скопировано";setTimeout(()=>copy.textContent="Копировать",1800)});</script></body></html>';
    }

    location ~ "^/happ/([A-Za-z0-9._~-]{1,160})/?$" {
        access_log off;
        default_type text/html;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; frame-ancestors 'none'" always;
        return 200 '<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="0;url=happ://add/https://__SUB_DOMAIN__:8443/sub/$1"><title>Открываем Happ</title><style>body{font-family:system-ui,sans-serif;padding:32px;max-width:520px;margin:auto;color:#172033}a{display:inline-block;padding:14px 20px;border-radius:12px;background:#2481cc;color:white;text-decoration:none;font-weight:700}</style></head><body><h1>Открываем Happ…</h1><p>Если приложение не открылось автоматически, нажмите кнопку.</p><p><a href="happ://add/https://__SUB_DOMAIN__:8443/sub/$1">Открыть в Happ</a></p><script>window.location.replace("happ://add/https://__SUB_DOMAIN__:8443/sub/$1");</script></body></html>';
    }

    location ~ "^/v2box/([A-Za-z0-9._~-]{1,160})/?$" {
        access_log off;
        default_type text/html;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; frame-ancestors 'none'" always;
        return 200 '<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="0;url=v2box://install-sub?url=https%3A%2F%2F__SUB_DOMAIN__%3A8443%2Fsub%2F$1&amp;name=CEA%20VPN"><title>Открываем V2Box</title><style>body{font-family:system-ui,sans-serif;padding:32px;max-width:520px;margin:auto;color:#172033}a{display:inline-block;padding:14px 20px;border-radius:12px;background:#2481cc;color:white;text-decoration:none;font-weight:700}.store{background:#334155}</style></head><body><h1>Открываем V2Box…</h1><p>Если приложение не открылось автоматически, нажмите кнопку.</p><p><a href="v2box://install-sub?url=https%3A%2F%2F__SUB_DOMAIN__%3A8443%2Fsub%2F$1&amp;name=CEA%20VPN">Открыть в V2Box</a></p><p><a class="store" href="https://apps.apple.com/app/v2box-v2ray-client/id6446814690">Установить V2Box</a></p><script>window.location.replace("v2box://install-sub?url=https%3A%2F%2F__SUB_DOMAIN__%3A8443%2Fsub%2F$1&name=CEA%20VPN");</script></body></html>';
    }

    location ^~ /sub/ {
        access_log off;
        limit_req zone=ceavpn_sub burst=10 nodelay;
        # Happ's ping can succeed even when a stale routing profile keeps
        # device traffic outside the tunnel. The documented subscription
        # header disables client-side routing and restores a full tunnel.
        add_header routing-enable "0" always;
        # Force the raw subscription format even when Telegram opens this URL
        # in a browser. Otherwise Marzban renders an HTML page with a direct
        # VLESS link, which Happ imports as a non-updatable standalone server.
        proxy_set_header Accept "text/plain";
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    location / {
        return 404;
    }
}

server {
    listen 127.0.0.1:9443 ssl;
    server_name __COVER_DOMAIN__;

    ssl_certificate /etc/letsencrypt/live/__SUB_DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__SUB_DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    server_tokens off;
    default_type text/html;

    return 200 '<!doctype html><html><head><title>CEA VPN</title></head><body></body></html>';
}
